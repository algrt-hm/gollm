# .github/workflows/build.yml

# Name of the workflow
name: Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push events for the "master" branch and version tags
  push:
    branches:
      - master
    tags:
      - 'v*'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job is named "build"
  build:
    # A name for the job that will be displayed in the GitHub UI
    name: Build for ${{ matrix.os }} (${{ matrix.goarch }})

    # The strategy defines a build matrix for your jobs.
    # This will create a separate job for each combination of os, goos, and goarch.
    strategy:
      matrix:
        # Define the target Go operating systems and architectures
        include:
          # Linux
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          # Windows
          - os: windows-latest
            goos: windows
            goarch: amd64
          # MacOS (Intel)
          - os: macos-latest
            goos: darwin
            goarch: amd64
          # MacOS (Apple Silicon)
          - os: macos-latest
            goos: darwin
            goarch: arm64

    # The type of runner that the job will run on, based on the matrix
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Check out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the Go environment on the runner
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Specify the Go version to use
          go-version: '1.22'

      # Step 3: Build the binary
      - name: Build
        # This is where we set the environment variables for cross-compilation
        env:
          # Disable CGO for static, portable binaries
          CGO_ENABLED: 0
          # Set the target operating system and architecture from the matrix
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          # The name of the binary
          BINARY_NAME="gollm"

          # Add the .exe extension for Windows builds
          if [ "${{ matrix.goos }}" == "windows" ]; then
            BINARY_NAME+=".exe"
          fi

          # Build the Go application
          # -v: verbose output
          # -o: specify the output file name
          # -ldflags="-s -w": strip debugging information to create a smaller binary
          # ./... : build the main package in the current directory or subdirectories
          go build -v -o "${BINARY_NAME}" -ldflags="-s -w" ./...

      # Step 4: Upload the binary as a build artifact (for regular pushes)
      - name: Upload Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          # The name of the artifact to be uploaded. This will be a zip file.
          name: gollm-${{ matrix.goos }}-${{ matrix.goarch }}
          # The path to the files you want to upload.
          # We use a glob pattern to find the binary, regardless of its extension.
          path: gollm*

      # Step 5: Create release and upload binaries (for tag pushes)
      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          # Create the release with the tag name
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          # Auto-generate release notes from commits
          generate_release_notes: true
          # Upload the binary to the release
          files: gollm*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
